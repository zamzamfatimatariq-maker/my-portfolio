<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Aesthetic Site</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(135deg, #000000, #0a0a0a, #111111);
      color: #00ffcc;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 50px;
      text-shadow: 0 0 15px #00ffcc;
      margin: 0;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
    }

    .box {
      margin-top: 20px;
      padding: 15px 25px;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      box-shadow: 0 0 20px #00ffcc;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 18px;
      background: #00ffcc;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>

</head>

<body>

  <h1>⚡ My First Website</h1>
  <p>Built using GitHub Pages</p>

  <div class="box">
    <p>🔥 Aesthetic Coding Vibes</p>
  </div>

  <button class="btn">Click Me</button>

</body>
</html>
